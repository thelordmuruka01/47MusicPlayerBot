services:
  - type: web
    name: kanjoos
    runtime: python
    plan: free

    buildCommand: "pip3 install --no-cache-dir -r requirements.txt"
    startCommand: "python3 -m modules"

    envVars:
      - key: API_ID
        sync: false

      - key: API_HASH
        sync: false

      - key: BOT_TOKEN
        sync: false

      - key: STRING_SESSION
        sync: false

      - key: PYTHON_VERSION
        value: "3.11.4"

      - key: PORT
        value: "10000"
