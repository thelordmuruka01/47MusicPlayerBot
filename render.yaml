
services:
  - type: web
    name: 47Music
    runtime: python
    plan: free

    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
        
      - key: API_ID
        sync: false

      - key: API_HASH
        sync: false

      - key: BOT_TOKEN
        sync: false

      - key: SESSION_NAME
        sync: false

      - key: OWNER_ID
        sync: false
