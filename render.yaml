services:
  - type: web
    name: 47Music
    runtime: python
    plan: free

    buildCommand: "pip3 install -U -r requirements.txt"
    startCommand: "python3 app.py"

    envVars:
      - key: API_ID
        sync: false

      - key: API_HASH
        sync: false

      - key: BOT_TOKEN
        sync: false

      - key: STRING_SESSION
        sync: false
        
      - key: OWNER_ID
        sync: false
